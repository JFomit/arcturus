[package]
name = "rust_dos"
version = "0.1.0"
authors = ["Hayato Ohhashi <o8@vmm.dev>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# strip = true  # Automatically strip symbols from the binary.
debug = 2

[dependencies]
rlibc = "1.0.0"
gdbstub = { version = "=0.7.7", default-features = false }
gdbstub_arch = {version = "0.3.2", default-features = false }
